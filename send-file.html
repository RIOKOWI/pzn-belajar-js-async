<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Register</h1>
    <form>
        <label for="username">Username :
            <input type="text" id="username" name="username">
        </label>
        <br>
        <label for="name">Name : 
            <input type="text" id="name" name="name">
        </label>
        <br>
        <label for="profile">Profile : 
            <input type="file" id="profile" name="profile" > 
            <!-- kalo mau lebih dari 1 file tambahin multiple -->
        </label>
        <br>
        <input type="button" id="login" value="Login">
    </form>
    <h1 id="response"></h1>
    <script>
        function doLogin() {
            const ajax = new XMLHttpRequest(); // call ajax method http request
            ajax.open("POST", "https://testjs.free.beeceptor.com"); // ("METHOD", "ENDPOINT");
            ajax.onload = function () { // function for showing response endpoint api
                const response = document.getElementById("response"); // get id element h1
                response.innerText = ajax.responseText; // masukan response ke element h1
            }

            const form = new FormData();
            form.append("username", document.getElementById("username").value) // kirim value username
            form.append("name", document.getElementById("name").value) // kirim value password
            form.append("profile", document.getElementById("profile").files.item(0)) // kirim file index pertama
            ajax.send(form); // kirim langsung form
        }

        document.getElementById("login").onclick = doLogin; // ketika user click button login function doLogin akan di panggil
    </script>
</body>
</html>
